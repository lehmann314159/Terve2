{{define "read-content"}}
<div class="reading-layout">
    <div class="text-panel">
        <div class="text-controls">
            <button class="btn" hx-get="/articles" hx-target="#article-select" hx-indicator="#articles-loading">
                Load Articles
            </button>
            <span id="article-select"></span>
            <span id="articles-loading" class="htmx-indicator">Loading...</span>
        </div>

        <details class="paste-area">
            <summary>Or paste your own text</summary>
            <form hx-post="/load-text" hx-target="#article-body">
                <textarea name="text" class="paste-input" rows="6" placeholder="Paste text here..."></textarea>
                <button type="submit" class="btn">Load Text</button>
            </form>
        </details>

        <div id="article-body" class="article-body">
            <p class="placeholder-text">Load an article or paste text above to begin reading.</p>
        </div>
    </div>

    <div class="analysis-panel" id="analysis-panel">
        <h3>Analysis</h3>
        <p class="placeholder-text">Click a word or select a phrase in the text to see its analysis.</p>
    </div>
</div>
{{end}}
